<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iAnima — ZueiraHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM + Babel (browser JSX) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html,body,#root{height:100%;}
    body{background:#0f1724;color:#e6eef8;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    /* hide simple scrollbar for demo */
    .scrollbar-hide::-webkit-scrollbar{display:none}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Icon placeholders (emoji) for browser usage
    const Ic = {
      Smile: () => <span>😊</span>,
      Frown: () => <span>😞</span>,
      MessageCircle: () => <span>💬</span>,
      Share2: () => <span>🔗</span>,
      PlusSquare: () => <span>➕</span>,
      Home: () => <span>🏠</span>,
      Flame: () => <span>🔥</span>,
      User: () => <span>👤</span>,
      ImageIcon: () => <span>🖼️</span>,
      Search: () => <span>🔎</span>,
      Bell: () => <span>🔔</span>,
      X: () => <span>❌</span>,
      Settings: () => <span>⚙️</span>,
      Send: () => <span>📤</span>
    };

    // Adapted app data and components from your code
    const initialMemes = [
      {
        id: 1,
        title: 'Eis que o professor apaga a lousa antes de você copiar...',
        author: '@aluno_desesperado',
        likes: 1240,
        comments: [
          { id: 1, user: '@nerd_da_sala', text: 'Eu já tinha copiado tudo 😎' },
          { id: 2, user: '@turma_do_fundao', text: 'F no chat família' }
        ],
        time: '2h',
        type: 'text-meme',
        content: 'Minha mente: "Vou lembrar de tudo, confia"',
        bgColor: 'bg-zinc-800',
        feed: 'destaques'
      },
      {
        id: 2,
        title: 'Quando a mãe diz "na volta a gente compra"',
        author: '@enzo_gameplays',
        likes: 8532,
        comments: [
          { id: 3, user: '@jovem_iludido', text: 'A maior mentira do universo' }
        ],
        time: '4h',
        type: 'image-mock',
        content: '🤡',
        subtitle: 'Nós nunca voltamos pelo mesmo caminho...',
        bgColor: 'bg-blue-900',
        feed: 'destaques'
      },
      {
        id: 3,
        title: 'Tentando explicar pro meu cachorro porque ele não pode comer chocolate',
        author: '@doguinho_feliz',
        likes: 42,
        comments: [],
        time: '5 min',
        type: 'text-meme',
        content: '"Mas humano, é tão cheiroso 🥺"',
        bgColor: 'bg-orange-900',
        feed: 'coletivo'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [feedTab, setFeedTab] = useState('destaques');
      const [memes, setMemes] = useState(initialMemes);
      const [activeComments, setActiveComments] = useState(null);

      const handleReact = (id, type) => {
        setMemes(memes.map(meme => {
          if (meme.id === id) {
            if (type === 'up') return { ...meme, likes: meme.likes + 1 };
            if (type === 'down') return { ...meme, likes: meme.likes - 1 };
          }
          return meme;
        }));
      };

      const currentMemes = memes.filter(meme => {
        if (feedTab === 'seguindo') return meme.author === '@enzo_gameplays';
        return meme.feed === feedTab || feedTab === 'destaques';
      });

      const CreatePost = () => {
        const [title, setTitle] = useState('');
        const [content, setContent] = useState('');

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!title || !content) return;
          const newMeme = {
            id: Date.now(),
            title,
            author: '@voce_anonimo',
            likes: 0,
            comments: [],
            time: 'Agora',
            type: 'text-meme',
            content,
            bgColor: 'bg-purple-900',
            feed: 'coletivo'
          };
          setMemes([newMeme, ...memes]);
          setActiveTab('home');
          setFeedTab('coletivo');
        };

        return (
          <div className="p-4 flex flex-col items-center animate-in fade-in slide-in-from-bottom-4">
            <h2 className="text-2xl font-bold mb-6 text-yellow-400">Postar a Braba no Coletivo</h2>
            <form onSubmit={handleSubmit} className="w-full max-w-md space-y-4">
              <div>
                <label className="block text-sm font-medium text-zinc-400 mb-1">Título (Eis que...)</label>
                <input
                  type="text"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-400"
                  placeholder="Ex: Eu chegando na escola..."
                  maxLength={80}
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-zinc-400 mb-1">Meme</label>
                <textarea
                  value={content}
                  onChange={(e) => setContent(e.target.value)}
                  className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 text-white h-32 resize-none focus:outline-none focus:border-yellow-400"
                  placeholder="Digite o texto do seu meme..."
                />
              </div>
              <button
                type="submit"
                className="w-full bg-yellow-500 hover:bg-yellow-400 text-zinc-950 font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
              >
                <Ic.ImageIcon />
                Enviar para Avaliação
              </button>
            </form>
          </div>
        );
      };

      const ProfilePage = () => {
        return (
          <div className="flex flex-col h-full animate-in fade-in">
            <div className="p-6 flex flex-col items-center border-b border-zinc-900 bg-zinc-900/30">
              <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-500 flex items-center justify-center text-4xl font-bold text-zinc-900 mb-4 shadow-lg shadow-yellow-500/20">VC</div>
              <h2 className="text-xl font-bold">@voce_anonimo</h2>
              <p className="text-zinc-400 text-sm mb-4">Membro desde 2024</p>

              <div className="flex gap-6 text-center w-full justify-center mb-4">
                <div>
                  <p className="text-2xl font-black text-yellow-400">1.2k</p>
                  <p className="text-xs text-zinc-500 uppercase font-bold">Sorrisos</p>
                </div>
                <div className="w-px bg-zinc-800"></div>
                <div>
                  <p className="text-2xl font-black">42</p>
                  <p className="text-xs text-zinc-500 uppercase font-bold">Inscritos</p>
                </div>
                <div className="w-px bg-zinc-800"></div>
                <div>
                  <p className="text-2xl font-black">15</p>
                  <p className="text-xs text-zinc-500 uppercase font-bold">Posts</p>
                </div>
              </div>

              <button className="w-full max-w-xs bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <Ic.Settings size={18} /> Editar Perfil
              </button>
            </div>

            <div className="p-4">
              <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Ic.ImageIcon size={20} className="text-yellow-400" /> Seus Memes Publicados</h3>
              <div className="grid grid-cols-3 gap-1">
                {[1,2,3,4,5,6].map(i => (
                  <div key={i} className="aspect-square bg-zinc-800 rounded-sm flex items-center justify-center hover:opacity-80 cursor-pointer">
                    <Ic.Smile />
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      const CommentsModal = ({ meme }) => {
        const [newComment, setNewComment] = useState('');

        const handleAddComment = (e) => {
          e.preventDefault();
          if (!newComment.trim()) return;

          const updatedMemes = memes.map(m => {
            if (m.id === meme.id) {
              return { ...m, comments: [...m.comments, { id: Date.now(), user: '@voce_anonimo', text: newComment }] };
            }
            return m;
          });
          setMemes(updatedMemes);
          setNewComment('');
        };

        return (
          <div className="absolute inset-0 z-50 bg-zinc-950 flex flex-col animate-in slide-in-from-bottom-full">
            <header className="flex items-center justify-between p-4 border-b border-zinc-900 bg-zinc-900">
              <h2 className="font-bold">Comentários ({meme.comments.length})</h2>
              <button onClick={() => setActiveComments(null)} className="p-2 bg-zinc-800 rounded-full hover:bg-zinc-700"><Ic.X /></button>
            </header>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {meme.comments.length === 0 ? (
                <div className="text-center text-zinc-500 mt-10">
                  <Ic.MessageCircle size={48} className="mx-auto mb-2 opacity-20" />
                  <p>Nenhum comentário ainda. Seja o primeiro!</p>
                </div>
              ) : (
                meme.comments.map(c => (
                  <div key={c.id} className="flex gap-3">
                    <div className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-xs font-bold shrink-0">{c.user.substring(1,3).toUpperCase()}</div>
                    <div>
                      <p className="text-sm font-bold text-zinc-300">{c.user}</p>
                      <p className="text-sm text-zinc-100">{c.text}</p>
                    </div>
                  </div>
                ))
              )}
            </div>

            <form onSubmit={handleAddComment} className="p-3 border-t border-zinc-900 bg-zinc-950 flex gap-2 pb-safe">
              <input type="text" value={newComment} onChange={(e) => setNewComment(e.target.value)} className="flex-1 bg-zinc-900 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-yellow-400 border border-transparent" placeholder="Adicione um comentário..." />
              <button type="submit" className="bg-yellow-500 text-zinc-950 p-2 rounded-full hover:bg-yellow-400 disabled:opacity-50" disabled={!newComment.trim()}><Ic.Send /></button>
            </form>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-zinc-950 text-zinc-100 flex justify-center font-sans">
          <div className="w-full max-w-lg bg-zinc-950 relative flex flex-col border-x border-zinc-900 h-screen overflow-hidden">

            <header className="flex flex-col border-b border-zinc-900 bg-zinc-950/95 backdrop-blur-sm z-10 shrink-0">
              <div className="flex items-center justify-between p-4">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center"><Ic.Smile /></div>
                  <h1 className="text-xl font-black tracking-tight text-white">Zueira<span className="text-yellow-400">Hub</span></h1>
                </div>
                <div className="flex gap-4 text-zinc-400"><Ic.Search /><Ic.Bell /></div>
              </div>

              {activeTab === 'home' && (
                <div className="flex justify-around border-t border-zinc-900">
                  {['destaques', 'coletivo', 'seguindo'].map((tab) => (
                    <button key={tab} onClick={() => setFeedTab(tab)} className={`flex-1 py-3 text-sm font-bold uppercase tracking-wider relative transition-colors ${feedTab === tab ? 'text-yellow-400' : 'text-zinc-500 hover:text-zinc-300'}`}>
                      {tab}
                      {feedTab === tab && (<div className="absolute bottom-0 left-0 w-full h-1 bg-yellow-400 rounded-t-full"></div>)}
                    </button>
                  ))}
                </div>
              )}
            </header>

            <main className="flex-1 overflow-y-auto pb-20 scrollbar-hide bg-black">
              {activeTab === 'home' && (
                <div className="flex flex-col gap-2">
                  {currentMemes.map((meme) => (
                    <article key={meme.id} className="bg-zinc-950 border-b border-zinc-900 pb-2">

                      <div className="p-3 flex items-center justify-between">
                        <div className="flex items-center gap-2 cursor-pointer group">
                          <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-500 flex items-center justify-center text-xs font-bold text-zinc-900 shadow-sm">{meme.author.substring(1, 3).toUpperCase()}</div>
                          <div>
                            <p className="font-bold text-sm group-hover:underline">{meme.author}</p>
                            <p className="text-xs text-zinc-500">{meme.time} • {meme.feed}</p>
                          </div>
                        </div>
                      </div>

                      <div className="px-4 pb-2"><h2 className="text-[15px] font-medium leading-snug">{meme.title}</h2></div>

                      <div className="relative">
                        <div className={`w-full aspect-square ${meme.bgColor} flex flex-col items-center justify-center p-6 text-center select-none`}>
                          {meme.type === 'image-mock' ? (
                            <>
                              <span className="text-7xl mb-4 drop-shadow-xl">{meme.content}</span>
                              <h3 className="text-2xl font-black uppercase text-white drop-shadow-lg">{meme.subtitle}</h3>
                            </>
                          ) : (
                            <h3 className="text-xl font-bold text-white max-w-[85%] leading-relaxed drop-shadow-md">{meme.content}</h3>
                          )}
                        </div>
                        <div className="w-full bg-zinc-950 p-2 flex justify-end items-center border-t border-zinc-900/50">
                          <span className="text-xs font-black text-zinc-500 tracking-widest uppercase flex items-center gap-1 opacity-80">Zueira<span className="text-yellow-500">Hub</span><Ic.Smile /></span>
                        </div>
                      </div>

                      <div className="p-2 px-4 flex items-center justify-between text-zinc-400 mt-1">
                        <div className="flex items-center bg-zinc-900 rounded-full border border-zinc-800">
                          <button onClick={() => handleReact(meme.id, 'up')} className="p-2 px-3 hover:text-yellow-400 hover:bg-zinc-800 rounded-l-full transition-all flex items-center gap-1"><Ic.Smile /></button>
                          <span className="font-bold text-sm min-w-[4ch] text-center text-white">{meme.likes}</span>
                          <button onClick={() => handleReact(meme.id, 'down')} className="p-2 px-3 hover:text-red-500 hover:bg-zinc-800 rounded-r-full transition-all flex items-center gap-1"><Ic.Frown /></button>
                        </div>

                        <div className="flex items-center gap-2">
                          <button onClick={() => setActiveComments(meme.id)} className="flex items-center gap-1.5 p-2 px-3 bg-zinc-900 rounded-full hover:bg-zinc-800 hover:text-white transition-colors border border-zinc-800"><Ic.MessageCircle /><span className="text-sm font-bold">{meme.comments.length}</span></button>
                          <button className="p-2 px-3 bg-zinc-900 rounded-full hover:bg-zinc-800 hover:text-white transition-colors border border-zinc-800"><Ic.Share2 /></button>
                        </div>
                      </div>
                    </article>
                  ))}

                  <div className="p-8 text-center text-zinc-600 font-bold">
                    <Ic.Smile size={32} className="mx-auto mb-2 opacity-50" />
                    <p>Você chegou ao fim dos memes desta aba.</p>
                  </div>
                </div>
              )}

              {activeTab === 'create' && <CreatePost />}
              {activeTab === 'profile' && <ProfilePage />}
            </main>

            {activeComments && (<CommentsModal meme={memes.find(m => m.id === activeComments)} />)}

            <nav className="absolute bottom-0 w-full bg-zinc-950 border-t border-zinc-900 flex justify-around items-center p-2 pb-safe z-10 shrink-0">
              <button onClick={() => setActiveTab('home')} className={`p-2 flex flex-col items-center transition-colors flex-1 ${activeTab === 'home' ? 'text-yellow-400' : 'text-zinc-500 hover:text-zinc-300'}`}><Ic.Home /></button>

              <div className="flex-1 flex justify-center"><button onClick={() => setActiveTab('create')} className="bg-yellow-400 text-zinc-950 p-3 rounded-2xl hover:bg-yellow-300 transition-colors shadow-lg shadow-yellow-400/20 transform -translate-y-4"><Ic.PlusSquare /></button></div>

              <button onClick={() => setActiveTab('profile')} className={`p-2 flex flex-col items-center transition-colors flex-1 ${activeTab === 'profile' ? 'text-yellow-400' : 'text-zinc-500 hover:text-zinc-300'}`}><Ic.User /></button>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
